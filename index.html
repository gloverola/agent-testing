<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Todo</h1>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <label for="todo-icon" class="visually-hidden">Icon</label>
      <select id="todo-icon" class="icon-select">
        <option value="📝" selected>📝 Note</option>
        <option value="🛒">🛒 Shopping</option>
        <option value="💼">💼 Work</option>
        <option value="🏠">🏠 Home</option>
        <option value="💪">💪 Health</option>
        <option value="📞">📞 Call</option>
      </select>
      <label for="todo-input" class="visually-hidden">New todo</label>
      <input id="todo-input" type="text" placeholder="What needs doing?" maxlength="200" required />
      <button type="submit">Add</button>
    </form>

    <div class="filters" role="group" aria-label="Filter todos">
      <button type="button" data-filter="all" class="active" aria-pressed="true">All</button>
      <button type="button" data-filter="active" aria-pressed="false">Active</button>
      <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty" class="empty">Nothing here yet.</p>

    <footer class="footer">
      <span id="count">0 items left</span>
      <div class="footer-actions">
        <button type="button" id="clear-completed">Clear completed</button>
        <button type="button" id="clear-all">Clear all</button>
      </div>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
